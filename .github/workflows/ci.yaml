name: CI
run-name: Проверка кода и тестов

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Check code and tests
        run: make check-ci
      - name: Check file hooks
        run: uv run --locked prek run --all-files --show-diff-on-failure --skip code-check
