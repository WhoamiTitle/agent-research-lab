name: agent-research-lab

services:
  hermes:
    image: nousresearch/hermes-agent:v0.21.6@sha256:55e192fba0cd4fde61142abbff5adeacff40efdb482ccd0ff877924bd274f909
    container_name: agent-research-hermes
    restart: unless-stopped
    command: [gateway, run]
    working_dir: /opt/data/workspace
    # This is the dedicated Linux VM's network, not the Mac's network.
    # Ollama uses VM loopback: reverse SSH for mac, or the docker profile below.
    network_mode: host
    volumes:
      - /srv/agent-lab/data:/opt/data
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_DASHBOARD: "0"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_PORT: "8642"
      TELEGRAM_ALLOW_ALL_USERS: "false"
      GATEWAY_ALLOW_ALL_USERS: "false"
      GATEWAY_ALLOWED_USERS: ""
      TELEGRAM_GUEST_MODE: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    # Keep the upstream init: it prepares the volume and drops Hermes to
    # UID 10000. Verify the runtime user, not just the container init user.
    mem_limit: 2300m
    cpus: 2.0
    pids_limit: 512
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  telegram:
    image: agent-research-telegram:local
    build:
      context: ../..
      dockerfile: infra/bot/Dockerfile
    container_name: agent-research-telegram
    restart: unless-stopped
    network_mode: host
    user: "10000:10000"
    # Model preparation is available before the Telegram wizard has been run.
    env_file:
      - path: /srv/agent-lab/bot/.env
        required: false
    volumes:
      - /srv/agent-lab/bot:/opt/bot
    depends_on:
      hermes:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ollama:
    # Enabled only for LAB_OLLAMA_BACKEND=docker; mac uses the SSH tunnel.
    profiles: [docker]
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    container_name: agent-research-ollama
    restart: unless-stopped
    network_mode: host
    user: "10000:10000"
    environment:
      HOME: /tmp
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "65536"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - /srv/agent-lab/ollama:/models
      - ../ollama/Modelfile:/opt/Modelfile:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 7g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
