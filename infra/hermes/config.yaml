model:
  default: agent-lab-qwen:4b
  provider: custom
  base_url: http://127.0.0.1:11434/v1
  api_key: ollama-local
  context_length: 65536
  ollama_num_ctx: 65536

fallback_providers: []
agent:
  max_turns: 8
  gateway_timeout: 300
  reasoning_effort: none
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 60
platform_toolsets:
  cli: [terminal, file, memory, skills, web, browser, cronjob]
  telegram: [terminal, file, memory, skills, web, browser]
  api_server: [terminal, file, memory, skills, web, browser, cronjob]
web:
  search_backend: ddgs
browser:
  # "off" disables the Browser Use CLI backend and selects built-in browser_*.
  backend: "off"
  cloud_provider: local
  inactivity_timeout: 60
memory:
  memory_enabled: true
  user_profile_enabled: true
unauthorized_dm_behavior: ignore
gateway:
  allow_all_users: false
  api_server:
    max_concurrent_runs: 1
platforms:
  telegram:
    enabled: false
    extra:
      guest_mode: false
      unauthorized_dm_behavior: ignore
  api_server:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8642

# DDGS search does not require an API key. Page reading uses the bundled
# browser. Only P1 readiness and autonomy checks are currently authorized.
