model:
  default: agent-lab-qwen:4b
  provider: custom
  base_url: http://127.0.0.1:11434/v1
  api_key: ollama-local
  context_length: 65536
  ollama_num_ctx: 65536

fallback_providers: []
agent:
  max_turns: 8
  gateway_timeout: 300
  reasoning_effort: none
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 60
platform_toolsets:
  cli: [terminal, file, memory, skills, web, browser, cronjob]
  telegram: [terminal, file, memory, skills, web, browser]
web:
  search_backend: ddgs
browser:
  # "off" disables the Browser Use CLI backend and selects built-in browser_*.
  backend: "off"
  cloud_provider: local
  inactivity_timeout: 60
memory:
  memory_enabled: true
  user_profile_enabled: true
gateway:
  platforms:
    telegram:
      enabled: false
      extra:
        guest_mode: false

# DDGS search does not require an API key. Page reading uses the bundled
# browser. Scheduler tools are prepared; no research jobs are authorized.
