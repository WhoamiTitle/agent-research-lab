/srv/agent-lab/data/logs/*.log {
    daily
    maxsize 10M
    rotate 7
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su researcher researcher
}

# Conversations, SQLite and s6's "current" logs are not rewritten here.
# s6 logs use their upstream rotation; see the verified preparation report.
